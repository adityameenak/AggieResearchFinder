<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lab Review — internal triage tool</title>
<style>
  :root { --bg:#faf8f3; --card:#fff; --line:#e7e0d3; --ink:#2a2622; --muted:#8a8275; --accent:#500000; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.5 -apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--ink); }
  header { position:sticky; top:0; background:var(--card); border-bottom:1px solid var(--line); padding:12px 20px; display:flex; gap:16px; align-items:center; flex-wrap:wrap; z-index:10; }
  header h1 { font-size:16px; margin:0; }
  .muted { color:var(--muted); }
  .pill { background:#f0ece2; border-radius:999px; padding:2px 10px; font-size:12px; }
  main { max-width:760px; margin:0 auto; padding:20px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px 20px; margin-bottom:16px; }
  .row { display:flex; gap:16px; }
  .photo { width:64px; height:64px; border-radius:10px; object-fit:cover; background:#eee; flex:0 0 auto; }
  .name { font-size:18px; font-weight:700; margin:0 0 2px; }
  .sub { color:var(--muted); font-size:13px; margin:0; }
  .tags { margin:8px 0; }
  .tag { display:inline-block; background:#f0ece2; border-radius:6px; padding:2px 8px; font-size:11px; margin-right:6px; }
  .summary { background:#f7f4ee; border-radius:8px; padding:10px 12px; font-size:13px; color:#444; margin:10px 0; white-space:pre-wrap; }
  .links a { display:inline-flex; align-items:center; gap:4px; margin-right:10px; font-weight:600; font-size:13px; text-decoration:none; color:var(--accent); }
  .links a.dim { color:#bbb; pointer-events:none; }
  .actions { display:flex; gap:8px; margin-top:14px; flex-wrap:wrap; }
  button { font:inherit; border:1px solid var(--line); background:#fff; border-radius:9px; padding:8px 14px; cursor:pointer; font-weight:600; }
  button:hover { background:#f5f1e9; }
  button.lab   { border-color:#7bb37b; color:#246b24; }
  button.nolab { border-color:#d49a9a; color:#a23a3a; }
  button.enrich{ border-color:#c9a86a; color:#8a6516; }
  button.sel { background:var(--accent); color:#fff; border-color:var(--accent); }
  textarea { width:100%; margin-top:10px; border:1px solid var(--line); border-radius:8px; padding:8px; font:inherit; resize:vertical; min-height:46px; }
  select, input[type=file] { font:inherit; padding:6px 8px; border:1px solid var(--line); border-radius:8px; background:#fff; }
  .toolbar { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .done { opacity:.5; }
  kbd { background:#eee; border-radius:4px; padding:1px 5px; font-size:11px; border:1px solid #ddd; }
  .empty { text-align:center; padding:60px 20px; color:var(--muted); }
</style>
</head>
<body>
<header>
  <h1>Lab Review <span class="muted">— internal triage</span></h1>
  <div class="toolbar">
    <label>Show
      <select id="filter">
        <option value="unreviewed">Unreviewed</option>
        <option value="withlinks">Unreviewed · has lab/scholar link</option>
        <option value="nolinks">Unreviewed · no links</option>
        <option value="all">All</option>
      </select>
    </label>
    <label>School
      <select id="school"><option value="">All</option></select>
    </label>
    <span class="pill" id="progress">0 / 0</span>
    <button id="export">Export decisions</button>
    <input type="file" id="picker" accept="application/json" style="display:none" />
    <button id="load">Load queue…</button>
  </div>
</header>
<main id="list"><div class="empty" id="hint">Loading queue… if nothing appears, click <b>Load queue…</b> and pick <code>lab-review-queue.json</code>.</div></main>

<script>
const LS = 'labReviewDecisions'
let QUEUE = []
let decisions = JSON.parse(localStorage.getItem(LS) || '{}')  // id -> {verdict, notes}

function save() { localStorage.setItem(LS, JSON.stringify(decisions)) }

function render() {
  const filter = document.getElementById('filter').value
  const school = document.getElementById('school').value
  const list = document.getElementById('list')
  const reviewed = Object.keys(decisions).filter(k => decisions[k]?.verdict).length
  document.getElementById('progress').textContent = `${reviewed} / ${QUEUE.length} reviewed`

  let items = QUEUE.filter(r => !school || r.university === school)
  if (filter === 'unreviewed') items = items.filter(r => !decisions[r.id]?.verdict)
  else if (filter === 'withlinks') items = items.filter(r => !decisions[r.id]?.verdict && (r.lab_website || r.google_scholar))
  else if (filter === 'nolinks') items = items.filter(r => !decisions[r.id]?.verdict && !(r.lab_website || r.google_scholar))

  if (!items.length) { list.innerHTML = '<div class="empty">Nothing to review here. 🎉</div>'; return }

  list.innerHTML = items.slice(0, 60).map(r => {
    const d = decisions[r.id] || {}
    const link = (href, label) => href
      ? `<a href="${href}" target="_blank" rel="noopener">${label} ↗</a>`
      : `<a class="dim">${label}</a>`
    return `<div class="card ${d.verdict ? 'done' : ''}" data-id="${r.id}">
      <div class="row">
        ${r.photo_url ? `<img class="photo" src="${r.photo_url}" alt="" onerror="this.style.display='none'">` : ''}
        <div style="flex:1; min-width:0">
          <p class="name">${esc(r.name)}</p>
          <p class="sub">${esc(r.title || '')} · ${esc(r.department)} · ${r.university.toUpperCase()}</p>
          <div class="links">
            ${link(r.profile_url, 'Profile')}
            ${link(r.lab_website, 'Lab site')}
            ${link(r.google_scholar, 'Scholar')}
          </div>
          ${r.research_summary ? `<div class="summary">${esc(r.research_summary)}</div>` : '<div class="summary muted">— no research summary captured —</div>'}
          <div class="actions">
            <button class="lab ${d.verdict==='lab'?'sel':''}"    data-v="lab">Has lab (l)</button>
            <button class="nolab ${d.verdict==='nolab'?'sel':''}" data-v="nolab">No lab (n)</button>
            <button class="enrich ${d.verdict==='enrich'?'sel':''}" data-v="enrich">Needs enrich (e)</button>
            <button data-v="">Clear</button>
          </div>
          <textarea placeholder="Notes / research blurb to add (optional)">${esc(d.notes || '')}</textarea>
        </div>
      </div>
    </div>`
  }).join('') + (items.length > 60 ? `<div class="empty">…and ${items.length-60} more. Mark these first.</div>` : '')

  list.querySelectorAll('.card').forEach(card => {
    const id = card.dataset.id
    card.querySelectorAll('button[data-v]').forEach(b => b.onclick = () => {
      decisions[id] = { ...(decisions[id]||{}), verdict: b.dataset.v }
      save(); render()
    })
    card.querySelector('textarea').onchange = e => {
      decisions[id] = { ...(decisions[id]||{}), notes: e.target.value }; save()
    }
  })
}

function esc(s){ return String(s??'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])) }

function ingest(data) {
  QUEUE = Array.isArray(data) ? data : []
  document.getElementById('hint')?.remove()
  const schools = [...new Set(QUEUE.map(r => r.university))].sort()
  document.getElementById('school').innerHTML =
    '<option value="">All</option>' + schools.map(s => `<option value="${s}">${s.toUpperCase()}</option>`).join('')
  render()
}

document.getElementById('filter').onchange = render
document.getElementById('school').onchange = render
document.getElementById('load').onclick = () => document.getElementById('picker').click()
document.getElementById('picker').onchange = e => {
  const f = e.target.files[0]; if (!f) return
  f.text().then(t => ingest(JSON.parse(t)))
}
document.getElementById('export').onclick = () => {
  const out = Object.entries(decisions).filter(([,d]) => d.verdict)
    .map(([id, d]) => ({ id, ...d }))
  const blob = new Blob([JSON.stringify(out, null, 2)], {type:'application/json'})
  const a = document.createElement('a')
  a.href = URL.createObjectURL(blob); a.download = 'lab-review-decisions.json'; a.click()
}
// keyboard: l / n / e on the first unreviewed card
document.addEventListener('keydown', ev => {
  if (['INPUT','TEXTAREA','SELECT'].includes(ev.target.tagName)) return
  const map = { l:'lab', n:'nolab', e:'enrich' }
  if (!map[ev.key]) return
  const first = document.querySelector('.card:not(.done)')
  if (first) { decisions[first.dataset.id] = { ...(decisions[first.dataset.id]||{}), verdict: map[ev.key] }; save(); render() }
})

// Try to auto-load the sibling queue (works when served over http; file:// will fall back to picker)
fetch('./lab-review-queue.json').then(r => r.ok ? r.json() : Promise.reject()).then(ingest).catch(() => {})
</script>
</body>
</html>
